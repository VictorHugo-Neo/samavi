version: '3.8'

services:
  samavi_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - samavi_db_data:/var/lib/postgresql/data
      - samavi_uploads:/app/dist/client/uploads
    networks:
      - samavi_net

  admin:
    build: ./admin
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - samavi_uploads:/app/public/uploads
      - samavi_uploads:/app/dist/client/uploads
    depends_on:
      - samavi_db  
    networks:
      - samavi_net
      - caddy_global_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - PUBLIC_ADMIN_URL=${PUBLIC_ADMIN_URL}
    restart: always
    environment:
      - PUBLIC_ADMIN_URL=${PUBLIC_ADMIN_URL}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - samavi_db  
    networks:
      - samavi_net
      - caddy_global_net
